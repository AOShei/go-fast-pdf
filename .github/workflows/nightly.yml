name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The public corpus against its baseline, and the soak test: every
  # file of the corpus and the files fetched for the soak test alone,
  # each in a process of its own under a time limit and a memory
  # ceiling, with the default options and with spans.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install poppler and qpdf
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - name: Restore the corpus cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/gofastpdf-corpus
          key: corpus-${{ hashFiles('testdata/fetch.sh') }}
      - name: Fetch the public corpus
        run: testdata/fetch.sh
      - name: Fetch the files for the soak test
        run: testdata/fetch.sh soak
      - name: Fetch the files encrypted for a certificate
        run: testdata/fetch.sh pubsec
      - name: Files encrypted for a certificate
        run: go test -run '^TestPublicKey' -v .
      - name: Public corpus
        run: go test -run '^TestPublicCorpus$' -timeout 150m -v .
      - name: Soak
        if: always()
        run: GOFASTPDF_SOAK_OUT=soak.txt go test -run '^TestSoak$' -timeout 150m -v .
      - name: Keep the soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak
          path: soak.txt
          if-no-files-found: ignore

  # This tree against the commit named in bench/BASE, both measured on
  # this runner, in turns. Fails if a benchmark is more than 10 percent
  # slower.
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Compare with the base
        run: bench/compare.sh
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench-compare.txt
          if-no-files-found: ignore

  fuzz-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "matrix=$(.github/scripts/fuzz-matrix.sh)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: fuzz-targets
    if: needs.fuzz-targets.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.fuzz-targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fuzz for one hour
        run: go test -run '^$' -fuzz "^${{ matrix.target }}\$" -fuzztime 1h "${{ matrix.pkg }}"
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-${{ strategy.job-index }}
          path: '**/testdata/fuzz/**'
