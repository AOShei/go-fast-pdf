name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the change touches anything but documents. A change of
  # documents and benchmark records alone, as the pull request of a
  # release is, sits on code that passed every check as the change before
  # it: the lint runs, and the tests and the fuzzing are not run a second
  # time on the same code. Anything else runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.code.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: code
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # For a pull request: what it changes from where it left its base.
          if [ "${{ github.event_name }}" = pull_request ]; then
            BASE=$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo "$BASE")
          fi
          code=$(.github/scripts/changed-code.sh "$BASE" "$HEAD")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changes code: $code"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not formatted with gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Dependencies
        run: .github/scripts/check-deps.sh

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # linux/amd64, linux/arm64, darwin/arm64 and windows/amd64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        go: ['1.25.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      # The reference tools make the differential checks run. Without them
      # those checks are skipped, as on macOS and Windows.
      - name: Install poppler and qpdf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - name: Test
        run: go test -race -timeout 20m ./...

  # A build for a 32-bit processor finds what assumes that an int holds
  # 64 bits: a size or an offset of a file that is larger than 2 GiB on
  # paper.
  test-32bit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test as a 386 build
        run: GOARCH=386 go test -timeout 20m ./...

  # Without the race detector: the tests of allocations and of time,
  # which skip themselves under it, and the share of the statements that
  # the tests run.
  budgets-and-coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install poppler and qpdf
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - name: Test with coverage
        run: go test -timeout 20m -coverpkg=./... -coverprofile=cover.out ./...
      - name: Coverage
        run: .github/scripts/check-coverage.sh cover.out

  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fuzz each listed target for 30 seconds
        run: |
          { grep -Ev '^(#|[[:space:]]*$)' .github/fuzz-targets.txt || true; } | while read -r pkg target; do
            echo "::group::$pkg $target"
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 30s "$pkg"
            echo "::endgroup::"
          done
